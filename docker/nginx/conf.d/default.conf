# ─────────────────────────────────────────────────────────────
#  Nginx Virtual Host Configuration
#  Reverse proxy for FastAPI YOLO Segmentation API
# ─────────────────────────────────────────────────────────────

# Docker DNS resolver for service discovery
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

upstream api_backend {
    # Resolve DNS dynamically for Docker container names
    server api:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ─────────────────────────────────────────────────────────────
    #  Security Headers
    # ─────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

    # ─────────────────────────────────────────────────────────────
    #  Root Location - Health Check Endpoint
    # ─────────────────────────────────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # ─────────────────────────────────────────────────────────────
    #  Documentation Endpoint
    # ─────────────────────────────────────────────────────────────
    location /docs {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    location /openapi.json {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # ─────────────────────────────────────────────────────────────
    #  Segmentation Endpoints
    # ─────────────────────────────────────────────────────────────
    location /segmentation/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # ─────────────────────────────────────────────────────────────
        #  WebSocket Support
        # ─────────────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ─────────────────────────────────────────────────────────────
        #  Timeouts for Long-Running Upload/Processing
        # ─────────────────────────────────────────────────────────────
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ─────────────────────────────────────────────────────────────
        #  Client Upload Size (100MB)
        # ─────────────────────────────────────────────────────────────
        client_max_body_size 100m;
    }

    # ─────────────────────────────────────────────────────────────
    #  Metrics Endpoint (Internal Access)
    # ─────────────────────────────────────────────────────────────
    location /metrics {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # ─────────────────────────────────────────────────────────────
    #  Default Proxy Configuration
    # ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # ─────────────────────────────────────────────────────────────
        #  Handle Special Cases
        # ─────────────────────────────────────────────────────────────
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 100m;

        # ─────────────────────────────────────────────────────────────
        #  Timeouts
        # ─────────────────────────────────────────────────────────────
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────────
    #  Static Content (if any)
    # ─────────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        # Try to serve from backend if available
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ─────────────────────────────────────────────────────────────
    #  Deny Access to Sensitive Paths
    # ─────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

