name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:

    runs-on:
      - self-hosted

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Environment
        run: |
          whoami
          hostname
          pwd
          docker --version
          docker compose version

      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d --build

      - name: Cleanup
        run: |
          docker image prune -f
      - name: Health Check
        run: |
         sleep 10
         curl http://localhost:8000/health