services:
  api:
    build: .
    container_name: yolo_segmentation_api
    image: yolo-segmentation:latest
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
    volumes:
      # Persist runtime artifacts outside the container
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
